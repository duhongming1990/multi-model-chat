name: Publish to npm

# Publishes this DSH bundle to the public npm registry.
#
# Triggers
#   - a published GitHub Release, whose tag must match package.json's version
#     (`v1.2.0` and `1.2.0` are both accepted)
#   - a manual run, with an optional dry-run and a choice of dist-tag
#
# Required repository secret
#   NPM_TOKEN  a granular npm access token with "Read and write (publish and
#              stage)" permission. npm no longer accepts classic tokens, and
#              bypass-2FA tokens are being restricted for direct publishing.
#              (Settings -> Secrets and variables -> Actions -> New repository secret)
#
# Modes
#   stage    (default) run `npm stage publish`: staging itself needs no 2FA, so a
#            token works from CI; a maintainer then approves the staged version
#            with 2FA on npmjs.com (security key/passkey works there) or with
#            `npm stage approve <stage-id>`. This is the supported path for a
#            brand-new package and for accounts whose second factor is a hardware
#            security key rather than a TOTP app.
#   publish  run `npm publish` directly. Use it only after this package has a
#            trusted publisher configured on npmjs.com and NODE_AUTH_TOKEN is
#            removed; direct token publishing is being retired by npm.
#
# Switch the default with the repository variable NPM_PUBLISH_MODE (stage|publish)
# or the manual-run `mode` input.
#
# npm trusted publishing (OIDC) is the token-less alternative, but npm only lets
# you configure a trusted publisher on a package that already exists. Publish the
# first version with NPM_TOKEN (or locally), then configure
# npmjs.com -> package -> Settings -> Trusted Publisher (GitHub Actions:
# owner, repo, workflow file publish-npm.yml), keep `id-token: write`, and delete
# the NODE_AUTH_TOKEN line below. This workflow upgrades npm so OIDC works.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag to publish under
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta
      mode:
        description: 'stage defers 2FA approval to npmjs.com; publish needs OIDC/trusted publishing'
        required: true
        default: stage
        type: choice
        options:
          - stage
          - publish
      dry-run:
        description: Only run the publish command with --dry-run
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # provenance attestation

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; a newer CLI also gives the
      # clearest diagnostics for 2FA/token problems.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Validate the publishable manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const problems = [];
          if (pkg.private === true) problems.push('package.json still has "private": true');
          if (typeof pkg.name !== 'string' || pkg.name.trim() === '') problems.push('package.json has no name');
          else if (pkg.name.startsWith('@local/')) problems.push(`package name "${pkg.name}" uses the reserved @local scope and cannot be published`);
          if (typeof pkg.version !== 'string' || pkg.version.trim() === '') problems.push('package.json has no version');
          if (pkg.dsh?.bundle?.patch === undefined) problems.push('package.json is missing dsh.bundle.patch');
          if (problems.length > 0) {
            for (const problem of problems) console.error(`- ${problem}`);
            process.exit(1);
          }
          console.log(`publishing ${pkg.name}@${pkg.version}`);
          NODE

      - name: Verify the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error::release tag '${tag}' does not match package.json version '${pkg_version}'"
            exit 1
          fi

      - name: Check the version is not already published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "::error::$name@$version is already published on npm. npm never allows republishing a version: bump the version (npm version patch) and release again."
            exit 1
          fi
          echo "$name@$version is not published yet"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dist-tag || 'latest' }}
          PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.NPM_PUBLISH_MODE || 'stage' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}
        run: |
          args=(--provenance --access public --tag "$DIST_TAG")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          set +e
          if [ "$PUBLISH_MODE" = "publish" ]; then
            echo "npm publish ${args[*]}"
            npm publish "${args[@]}"
            status=$?
          else
            echo "npm stage publish ${args[*]}"
            npm stage publish "${args[@]}"
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "::notice::Staged. Approve with 2FA: npm stage list dsh-multi-model-chat then npm stage approve <stage-id>, or approve it in the staged-packages queue on npmjs.com."
            fi
          fi
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::publishing failed (exit $status). For stage mode NPM_TOKEN needs 'Read and write (publish and stage)'. For direct mode npm requires OIDC/trusted publishing (bypass-2FA tokens are being retired). See README '发布到 npm'."
            exit "$status"
          fi
