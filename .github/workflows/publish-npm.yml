name: Publish to npm

# Publishes this DSH bundle to the public npm registry.
#
# Triggers
#   - a published GitHub Release, whose tag must match package.json's version
#     (`v1.2.0` and `1.2.0` are both accepted)
#   - a manual run, with an optional dry-run and a choice of dist-tag
#
# Required repository secret
#   NPM_TOKEN  an npm automation token with publish rights for this package.
#              (Settings -> Secrets and variables -> Actions -> New repository secret)
#
# If you prefer npm trusted publishing (OIDC) over a token, configure the
# package as a trusted publisher on npmjs.com, keep the `id-token: write`
# permission below, and delete the NODE_AUTH_TOKEN line in the Publish step.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag to publish under
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta
      dry-run:
        description: Only run `npm publish --dry-run`
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # provenance attestation

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate the publishable manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const problems = [];
          if (pkg.private === true) problems.push('package.json still has "private": true');
          if (typeof pkg.name !== 'string' || pkg.name.trim() === '') problems.push('package.json has no name');
          else if (pkg.name.startsWith('@local/')) problems.push(`package name "${pkg.name}" uses the reserved @local scope and cannot be published`);
          if (typeof pkg.version !== 'string' || pkg.version.trim() === '') problems.push('package.json has no version');
          if (pkg.dsh?.bundle?.patch === undefined) problems.push('package.json is missing dsh.bundle.patch');
          if (problems.length > 0) {
            for (const problem of problems) console.error(`- ${problem}`);
            process.exit(1);
          }
          console.log(`publishing ${pkg.name}@${pkg.version}`);
          NODE

      - name: Verify the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error::release tag '${tag}' does not match package.json version '${pkg_version}'"
            exit 1
          fi

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dist-tag || 'latest' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}
        run: |
          args=(--provenance --access public --tag "$DIST_TAG")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          echo "npm publish ${args[*]}"
          npm publish "${args[@]}"
